version: '3.3'
services:
  gokapi:
    # FGS Share has no published image: this builds one from the clone.
    # deploy/docker-compose.yml is the hardened file the live instance uses.
    build: .
    image: fgs-share
    container_name: gokapi
    ports:
      - "127.0.0.1:53842:53842"
    volumes:
      - ./gokapi-data:/app/data
      - ./gokapi-config:/app/config
    restart: always
    env_file:
      - "./.env"
